<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="card">
  <h1>Reset password</h1>
  <p class="subtitle" id="subtitle">Choose a new password</p>

  <div class="msg" id="invalidTokenMsg"></div>

  <form id="resetForm">
    <label for="password">New password</label>
    <div class="password-field">
      <input type="password" id="password" autocomplete="new-password" required>
      <button type="button" class="toggle-visibility" data-target="password">Show</button>
    </div>
    <div class="strength-meter"><div class="strength-meter-fill" id="strengthFill"></div></div>
    <div class="strength-label" id="strengthLabel">Enter a password</div>

    <label for="confirmPassword">Confirm new password</label>
    <div class="password-field">
      <input type="password" id="confirmPassword" autocomplete="new-password" required>
      <button type="button" class="toggle-visibility" data-target="confirmPassword">Show</button>
    </div>

    <button type="submit" class="primary" id="resetSubmit">Reset password</button>
    <div class="msg" id="resetMsg"></div>
  </form>

  <p class="footer-link"><a href="/login.html">Back to login</a></p>
</div>
<script src="/js/common.js"></script>
<script src="/js/reset.js"></script>
</body>
</html>
